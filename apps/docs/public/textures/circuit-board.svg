    <path d="M120 160h40l15 15v35l-15 15h-30l-15-15v-35" />

    <!-- Path 3 -->
    <path d="M0 260h50l20-20h40l20 20h70l20-20h40l15 15h49" />
    <path d="M200 40v40l20 20h40l15-15v-30" />
    <path d="M260 120v40l-15 15h-45l-20-20v-35" />

