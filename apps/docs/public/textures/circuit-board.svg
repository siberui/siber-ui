    <rect x="22" y="92" width="28" height="28" rx="3" stroke="#00d9e8" stroke-opacity="0.3" stroke-width="1.2" />
    <rect x="242" y="192" width="32" height="32" rx="3" stroke="#00d9e8" stroke-opacity="0.3" stroke-width="1.2" />
  </g>

